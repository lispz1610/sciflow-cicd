# Push-only lint, architecture audit, and full Python test matrix.
# Pull requests run their Python matrix once in ci.yml (with the stable status
# check); verify-release still runs for both events so release evidence stays covered.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pyyaml
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Audit architectural module dependencies
      run: |
        python3 scripts/audit_module_dependencies.py
    - name: Test with pytest
      run: |
        pytest

  verify-release:
    needs: build
    # The push-only build is skipped for PRs; still run the release gate there.
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Verify release candidate evidence
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ -n "$GITHUB_BASE_REF" ]; then
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          control_ref="$(git rev-parse FETCH_HEAD)"
          python3 scripts/verify_release.py --record docs/release-control.json --report docs/release-control.md --record-ref "$control_ref" --labels "$PR_LABELS" --ci
          exit $?
        fi
        python3 scripts/verify_release.py --record docs/release-evidence.json --report docs/production-release-audit.md --ci
