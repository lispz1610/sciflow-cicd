name: Release promotion

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  checks: read
  pull-requests: read

jobs:
  promote-release:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release-candidate')
    runs-on: ubuntu-24.04
    concurrency:
      group: release-promotion-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out the actual merged commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the candidate commit for fingerprint verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$HEAD_SHA^{commit}"; then
            git -c credential.helper='!gh auth git-credential' fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
            test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          fi
      - name: Check out trusted release verification code
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          mapfile -t trusted_bases < <(git merge-base --all "$HEAD_SHA" "$MERGE_SHA^1")
          if [ "${#trusted_bases[@]}" -ne 1 ]; then
            echo "::error::Cannot identify one trusted pre-merge ancestor"
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/trusted-release-code" "${trusted_bases[0]}"
          test -f "$RUNNER_TEMP/trusted-release-code/scripts/release_promotion.py"
          test -f "$RUNNER_TEMP/trusted-release-code/scripts/verify_release.py"
      - name: Validate release evidence and prepare assets
        id: prepare
        env:
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/release-promotion.json"
          # The tag is declared by maintainers in the trusted Control Record; the script refuses to publish without it.
          release_tag="v$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidate"]["target_version"])' docs/release-control.json)"
          release_profile="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); print(data.get("candidate", {}).get("profile") or data.get("profile") or "release")' docs/release-control.json)"
          python3 "$RUNNER_TEMP/trusted-release-code/scripts/release_promotion.py" \
            --event "$EVENT_PATH" \
            --control docs/release-control.json \
            --evidence docs/release-evidence.json \
            --audit-report docs/release-control.md \
            --output-dir "$RUNNER_TEMP/release-assets" \
            --tag "$release_tag" \
            --profile "$release_profile" \
            --repo-root . --verify-gate > "$payload"
          if [ ! -s "$payload" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$payload" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as payload_file:
              metadata = json.load(payload_file)
          if metadata.get("skipped"):
              print("skipped=true")
              raise SystemExit(0)
          for key in ("tag", "target_sha", "version"):
              print(f"{key}={metadata[key]}")
          print("optional_assets=" + " ".join(metadata["optional_assets"]))
          print("skipped=false")
          PY
      - name: Create an annotated immutable tag at the merged commit
        if: steps.prepare.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
          TARGET_SHA: ${{ steps.prepare.outputs.target_sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Refusing to replace existing release tag $TAG"
            exit 1
          fi
          python3 - "$TAG" "$TARGET_SHA" "$RUNNER_TEMP/release-assets/release-notes.md" "$RUNNER_TEMP/annotated-tag.json" <<'PY'
          import json
          import sys

          tag, target_sha, notes_path, payload_path = sys.argv[1:]
          with open(notes_path, encoding="utf-8") as notes_file:
              notes = notes_file.read()
          with open(payload_path, "w", encoding="utf-8") as payload_file:
              json.dump({"tag": tag, "message": notes, "object": target_sha, "type": "commit"}, payload_file)
          PY
          tag_object_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" --method POST --input "$RUNNER_TEMP/annotated-tag.json" --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
            -f "ref=refs/tags/$TAG" \
            -f "sha=$tag_object_sha" >/dev/null
      - name: Publish GitHub Release with audit evidence
        if: steps.prepare.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          OPTIONAL_ASSETS: ${{ steps.prepare.outputs.optional_assets }}
        run: |
          set -euo pipefail
          # Optional assets (for example sbom.spdx.json, CITATION.cff) are attached only as the selected profile dictates.
          extra_assets=()
          for asset in $OPTIONAL_ASSETS; do
            extra_assets+=("$RUNNER_TEMP/release-assets/$asset")
          done
          gh release create "$TAG" \
            --verify-tag \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-assets/release-notes.md" \
            "$RUNNER_TEMP/release-assets/audit-report.md" \
            "$RUNNER_TEMP/release-assets/runtime-fingerprint.txt" \
            "${extra_assets[@]}"
