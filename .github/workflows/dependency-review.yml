name: Dependency review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - requirements.txt
      - pyproject.toml
      - '**/requirements*.txt'
      - setup.py

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dependency Review
        uses: actions/dependency-review-action@5a2ce3f5b92ee19cbb1541a4984c76d921601d7c
        with:
          fail-on-severity: 'high'
          allow-licenses: 'MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC, Python-2.0'
