name: Issue triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  label-triage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Apply issue labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/issue_triage.py --mode labels

  add-to-project:
    if: github.event_name == 'issues' && github.event.action == 'opened' && vars.TRIAGE_PROJECT_ID != ''
    needs: label-triage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Add issue to project
        env:
          TRIAGE_PROJECT_ID: ${{ vars.TRIAGE_PROJECT_ID }}
          TRIAGE_PROJECT_TOKEN: ${{ secrets.TRIAGE_PROJECT_TOKEN }}
        run: python3 scripts/issue_triage.py --mode project
