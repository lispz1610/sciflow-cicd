# sciflow-cicd workflow-template=profile-ci version=1
name: "Python CI"
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  ci:
    name: "Python CI (${{ matrix.python-version }})"
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.4.0
        with:
          python-version: "${{ matrix.python-version }}"
      - run: "pip install pytest pyyaml"
      - run: "pytest -v"
  status-check:
    name: "status-check"
    needs: [ci]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Evaluate status check"
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          python3 -c '
          import json, sys, os
          needs = json.loads(os.environ.get("NEEDS_CONTEXT", "{}"))
          failed = [name for name, job in needs.items() if job.get("result") in ("failure", "cancelled")]
          skipped = [name for name, job in needs.items() if job.get("result") == "skipped"]
          success = [name for name, job in needs.items() if job.get("result") == "success"]
          print(f"Status check results - success: {success}, skipped: {skipped}, failed: {failed}")
          if failed:
              sys.exit(f"Status check failed: {failed}")
          print("Status check passed.")
          '
