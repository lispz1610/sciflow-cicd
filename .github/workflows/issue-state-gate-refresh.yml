# sciflow-cicd workflow-template=issue-state-gate-refresh version=1
name: Issue State Gate Refresh

on:
  issues:
    types: [closed, reopened]

permissions:
  contents: read
  checks: write
  issues: read
  pull-requests: read

jobs:
  refresh-gates:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Refresh matching pull request checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/refresh_issue_state_gate.py
