# sciflow-cicd workflow-template=issue-state-gate-refresh version=1
name: Issue State Gate Refresh

on:
  issues:
    types: [closed, reopened]

permissions:
  contents: read
  checks: write
  issues: read
  pull-requests: read

jobs:
  refresh-gates:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Refresh matching pull request checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/refresh_issue_state_gate.py
