name: Issue frontier orchestrator

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  orchestrate-frontier:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Orchestrate issue frontier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/orchestrate_issue_frontier.py --event "$EVENT_PATH"
