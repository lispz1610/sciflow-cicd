# sciflow-cicd workflow-template=issue-delivery-enforce version=1
name: Issue Delivery Enforcement

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-delivery-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  enforce-delivery:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Enforce published delivery evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/enforce_issue_delivery.py --repo "$GITHUB_REPOSITORY" --issue "$ISSUE_NUMBER"
