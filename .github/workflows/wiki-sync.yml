name: Wiki sync

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - README.md

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Publish Wiki pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set -- --repo "$GITHUB_REPOSITORY" --source-dir . \
            --wiki-url "https://github.com/${GITHUB_REPOSITORY}.wiki.git" \
            --page README.md=Home
          while IFS= read -r file; do
            page="${file%.md}"
            page="${page//\//-}"
            set -- "$@" --page "$file=$page"
          done < <(find docs -type f -name '*.md' | sort)
          python3 scripts/publish_github_wiki.py "$@" --apply --allow-uninitialized
